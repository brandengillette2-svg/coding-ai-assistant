version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wizard-postgres
    environment:
      POSTGRES_USER: wizard
      POSTGRES_PASSWORD: wizard_password
      POSTGRES_DB: wizard_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wizard -d wizard_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wizard-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: wizard-api
    environment:
      DATABASE_URL: postgresql://wizard:wizard_password@postgres:5432/wizard_db
      REDIS_URL: redis://redis:6379/0
      MODEL_PROVIDER: openai
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      REPO_ROOT: /app/repos
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./repos:/app/repos
      - ./work:/app/work
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: wizard-worker
    environment:
      DATABASE_URL: postgresql://wizard:wizard_password@postgres:5432/wizard_db
      REDIS_URL: redis://redis:6379/0
      MODEL_PROVIDER: openai
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      REPO_ROOT: /app/repos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./repos:/app/repos
      - ./work:/app/work
    command: python -m app.worker
    restart: unless-stopped

  planner:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: wizard-planner
    environment:
      SERVICE_ROLE: planner
      DATABASE_URL: postgresql://wizard:wizard_password@postgres:5432/wizard_db
      REDIS_URL: redis://redis:6379/0
      MODEL_PROVIDER: openai
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      REPO_ROOT: /app/repos
    depends_on:
      - postgres
      - redis
    command: python -m services.planner_service
    restart: unless-stopped

  coder:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: wizard-coder
    environment:
      SERVICE_ROLE: coder
      DATABASE_URL: postgresql://wizard:wizard_password@postgres:5432/wizard_db
      REDIS_URL: redis://redis:6379/0
      MODEL_PROVIDER: openai
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      REPO_ROOT: /app/repos
    depends_on:
      - postgres
      - redis
    command: python -m services.coder_service
    restart: unless-stopped

  reviewer:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: wizard-reviewer
    environment:
      SERVICE_ROLE: reviewer
      DATABASE_URL: postgresql://wizard:wizard_password@postgres:5432/wizard_db
      REDIS_URL: redis://redis:6379/0
      MODEL_PROVIDER: openai
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      REPO_ROOT: /app/repos
    depends_on:
      - postgres
      - redis
    command: python -m services.reviewer_service
    restart: unless-stopped

  verifier:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: wizard-verifier
    environment:
      SERVICE_ROLE: verifier
      DATABASE_URL: postgresql://wizard:wizard_password@postgres:5432/wizard_db
      REDIS_URL: redis://redis:6379/0
      REPO_ROOT: /app/repos
    depends_on:
      - postgres
      - redis
    command: python -m services.verifier_service
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: wizard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.1.0
    container_name: wizard-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  postgres_data:

networks:
  default:
    name: wizard-network
